name: Production Authenticated Role Browser Acceptance (Manual)

on:
  workflow_dispatch:

# Never run automatically against Production accounts. A repository admin must
# configure and approve the protected 'production-role-qa' environment first.
# All three identities are existing, explicitly approved testing accounts.
permissions:
  contents: read

concurrency:
  group: sukun-production-role-browser-manual
  cancel-in-progress: false

jobs:
  credentialed-production-browser:
    name: Approved Member, Patient and Admin read-only Chrome RLS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-role-qa
    env:
      SUKUN_PRODUCTION_ROLE_MEMBER_EMAIL: ${{ secrets.SUKUN_PRODUCTION_ROLE_MEMBER_EMAIL }}
      SUKUN_PRODUCTION_ROLE_MEMBER_PASSWORD: ${{ secrets.SUKUN_PRODUCTION_ROLE_MEMBER_PASSWORD }}
      SUKUN_PRODUCTION_ROLE_PATIENT_EMAIL: ${{ secrets.SUKUN_PRODUCTION_ROLE_PATIENT_EMAIL }}
      SUKUN_PRODUCTION_ROLE_PATIENT_PASSWORD: ${{ secrets.SUKUN_PRODUCTION_ROLE_PATIENT_PASSWORD }}
      SUKUN_PRODUCTION_ROLE_ADMIN_EMAIL: ${{ secrets.SUKUN_PRODUCTION_ROLE_ADMIN_EMAIL }}
      SUKUN_PRODUCTION_ROLE_ADMIN_PASSWORD: ${{ secrets.SUKUN_PRODUCTION_ROLE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Refuse stale main and missing approved test identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          for key in SUKUN_PRODUCTION_ROLE_MEMBER_EMAIL \
            SUKUN_PRODUCTION_ROLE_MEMBER_PASSWORD \
            SUKUN_PRODUCTION_ROLE_PATIENT_EMAIL \
            SUKUN_PRODUCTION_ROLE_PATIENT_PASSWORD \
            SUKUN_PRODUCTION_ROLE_ADMIN_EMAIL \
            SUKUN_PRODUCTION_ROLE_ADMIN_PASSWORD; do
            test -n "${!key:-}" || {
              echo "Missing protected Production test-account secret"; exit 1;
            }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check acceptance source and install pinned browser driver
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/production_authenticated_role_acceptance.cjs
          google-chrome --version
          npm install --no-save --no-package-lock --prefix .github/scripts playwright-core@1.55.1

      - name: Verify real Production session, browser CORS and role isolation
        shell: bash
        run: |
          set -euo pipefail
          export SUKUN_EXPECTED_MAIN_SHA="$(git rev-parse HEAD)"
          node .github/scripts/production_authenticated_role_acceptance.cjs
