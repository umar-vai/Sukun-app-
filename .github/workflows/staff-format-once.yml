name: One-time staff Dart formatter
on:
  push:
    branches: [feat/care-team-role-isolation-20261009]
    paths: ['.github/workflows/staff-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/care-team-role-isolation-20261009
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Format staff Dart files
        run: |
          set -euo pipefail
          dart format \
            app/lib/core/auth/user_role.dart \
            app/lib/core/auth/app_session.dart \
            app/lib/core/auth/supabase_auth_repository.dart \
            app/lib/app/router/app_router.dart \
            app/test/core/auth/user_role_test.dart \
            app/test/app/role_routing_test.dart
          git diff --check
          git add app/lib app/test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(staff): format care team Dart role changes"
          git push origin HEAD:feat/care-team-role-isolation-20261009
