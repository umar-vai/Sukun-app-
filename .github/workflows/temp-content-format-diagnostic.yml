name: Temp Content UX Formatting Diagnostic

on:
  push:
    branches: [integration/prelaunch-readiness-20261008]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show exact dartfmt changes
        run: |
          dart format lib test
          git diff -- lib test
          git diff --exit-code
      - name: Analyze
        run: flutter analyze
      - name: Content admin tests
        run: flutter test test/features/content_admin/admin_content_test.dart
