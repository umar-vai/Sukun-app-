name: Temporary Resource Hub Preflight
on:
  push:
    branches: [fix/hide-recent-resources-on-hub-20261008]
    paths:
      - .github/workflows/resource-hub-preflight.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Normalize Dart formatting
        working-directory: app
        run: dart format lib/features/resources/presentation/resources_home_screen.dart test/features/resources/resources_home_screen_test.dart
      - name: Commit formatting to draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/features/resources/presentation/resources_home_screen.dart app/test/features/resources/resources_home_screen_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(resources): canonical formatting after recent section removal'
            git push
          fi
      - name: Analyze app
        working-directory: app
        run: flutter analyze
      - name: Run app tests
        working-directory: app
        run: flutter test
      - name: Check web build
        working-directory: app
        run: flutter build web --release --base-href /Sukun-app-/
