name: Temporary Video UI Formatter
on:
  push:
    branches: [fix/video-one-tap-player-20261009]
    paths: [.github/workflows/format-video-draft.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Format touched Dart files
        run: dart format app/lib/features/resources/presentation/resource_category_screen.dart app/lib/features/resources/presentation/resources_home_screen.dart app/lib/features/resources/presentation/resource_detail_screen.dart app/lib/features/resources/presentation/youtube_player_screen.dart app/lib/features/resources/domain/video_navigation.dart app/test/features/resources/video_navigation_test.dart
      - name: Save only Dart formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/features/resources/presentation/resource_category_screen.dart app/lib/features/resources/presentation/resources_home_screen.dart app/lib/features/resources/presentation/resource_detail_screen.dart app/lib/features/resources/presentation/youtube_player_screen.dart app/lib/features/resources/domain/video_navigation.dart app/test/features/resources/video_navigation_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(video): canonical Dart formatting'
            git push
          fi
