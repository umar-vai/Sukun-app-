name: Flutter Web Preview

on:
  pull_request:
    branches: [main, feat/otp-google-auth-gates-20261009]
    paths:
      - 'app/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/functional-web-pages.yml'
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sukun-web-preview-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build actual Flutter Web application
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Refuse stale successful CI runs
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.workflow_run.head_sha }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Reuse existing Web assets or generate missing platform scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [ -f web/index.html ]; then
            echo 'Using existing Flutter Web platform files.'
          else
            default_test_missing=0
            if [ ! -f test/widget_test.dart ]; then default_test_missing=1; fi
            flutter create --platforms web --project-name sukun_life .
            if [ "$default_test_missing" -eq 1 ] &&
               [ -f test/widget_test.dart ] &&
               grep -Fq 'MyApp' test/widget_test.dart; then
              rm test/widget_test.dart
            fi
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check anonymous production privacy gate syntax
        shell: bash
        run: bash -n "$GITHUB_WORKSPACE/.github/scripts/verify-staging-preview.sh"

      - name: Inspect Production Google OAuth provider readiness (read-only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PUBLIC_API_KEY: sb_publishable_bRXqmJeOzc3Dq8BTzyqRKg_gzpAeCPz
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            --header "apikey: $PUBLIC_API_KEY" \
            "https://vydfafumxptanpkmtrpr.supabase.co/auth/v1/settings" \
            > /tmp/sukun-auth-public-settings.json
          jq -e '.external.google | type == "boolean"' \
            /tmp/sukun-auth-public-settings.json > /dev/null
          if jq -e '.external.google == true' \
            /tmp/sukun-auth-public-settings.json > /dev/null; then
            echo 'Production Google OAuth provider: enabled; redirect and account-flow verification still required.'
          else
            echo 'Production Google OAuth provider: disabled; do not expose an unusable sign-in button.'
          fi

      - name: Verify Production anonymous data isolation before merging
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          APP_ENVIRONMENT: production
          SUPABASE_URL: https://vydfafumxptanpkmtrpr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_bRXqmJeOzc3Dq8BTzyqRKg_gzpAeCPz
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/verify-staging-preview.sh"

      - name: Verify 114 Production Quran surahs and translated ayat
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PUBLIC_PRODUCTION_KEY: sb_publishable_bRXqmJeOzc3Dq8BTzyqRKg_gzpAeCPz
        run: |
          set -euo pipefail
          endpoint=https://vydfafumxptanpkmtrpr.supabase.co/functions/v1/quran-content
          curl --fail-with-body --silent --show-error --retry 2 --max-time 40 \
            --header "apikey: $PUBLIC_PRODUCTION_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"action":"chapters"}' "$endpoint" > /tmp/prod-quran-chapters.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/prod-quran-chapters.json'))
          chapters=d.get('chapters', [])
          assert len(chapters)==114, 'Missing Production Quran surahs'
          assert chapters[0]['id']==1 and chapters[-1]['id']==114
          print('PASS: Production 114-surah catalog')
          PY
          curl --fail-with-body --silent --show-error --retry 2 --max-time 40 \
            --header "apikey: $PUBLIC_PRODUCTION_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"action":"verses","chapter":1,"page":1}' "$endpoint" > /tmp/prod-quran-fatiha.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/prod-quran-fatiha.json'))
          verses=d.get('verses', [])
          assert len(verses)==7, 'Al-Fatihah must return seven ayat'
          assert all(x.get('text_uthmani') and x.get('translations') and x['translations'][0].get('text') for x in verses)
          print('PASS: Production Arabic ayat and Bengali translation')
          PY

      - name: Inspect Production Google OAuth provider readiness
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PUBLIC_PRODUCTION_KEY: sb_publishable_bRXqmJeOzc3Dq8BTzyqRKg_gzpAeCPz
        run: |
          set -euo pipefail
          url=https://vydfafumxptanpkmtrpr.supabase.co/auth/v1/settings
          status=$(curl --silent --show-error --max-time 25 \
            --header "apikey: $PUBLIC_PRODUCTION_KEY" \
            --output /tmp/prod-auth-settings.json --write-out '%{http_code}' "$url")
          if [[ "$status" != "200" ]]; then
            echo "Production Google provider readiness unavailable (HTTP $status)"
          elif jq -e '.external.google == true' /tmp/prod-auth-settings.json >/dev/null; then
            echo "Production Google provider ENABLED; browser redirect acceptance is still required."
          else
            echo "Production Google provider DISABLED; keep active Google button gated."
          fi

      - name: Validate full Flutter source and browser-compatible tests
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Browser-platform role and navigation regressions (Chrome)
        run: |
          flutter test --platform chrome \
            test/core/config/web_preview_config_test.dart \
            test/app/role_routing_test.dart \
            test/app/role_navigation_shell_test.dart \
            test/core/widgets/global_audio_dock_test.dart \
            test/core/widgets/palette_navigation_test.dart \
            test/app/preauth_protected_routes_test.dart \
            test/features/auth/member_signup_screen_test.dart \
            test/features/patient_care/patient_scaffold_test.dart \
            test/features/home/admin_quick_actions_test.dart \
            test/features/home/admin_logout_action_test.dart \
            test/features/home/member_session_logout_layout_test.dart \
            test/features/islamic_utilities/compass_web_fallback_test.dart \
            test/features/resources/resources_home_screen_test.dart \
            test/features/resources/quran_tabbed_screen_test.dart \
            test/features/resources/resource_category_search_test.dart \
            test/features/patients/prescription_ai_entry_test.dart \
            test/features/resources/resource_preview_unavailable_test.dart \
            test/features/patient_care/patient_notifications_screen_test.dart \
            test/features/resources/resource_detail_screen_test.dart \
            test/features/resources/resource_detail_session_isolation_test.dart \
            test/features/resources/pdf_reader_screen_test.dart \
            test/features/resources/audio_platform_hint_test.dart \
            test/core/media/audio_source_reload_test.dart \
            test/features/resources/audio_player_retry_test.dart \
            test/features/resources/video_load_phase_test.dart \
            test/features/patient_care/completion_queue_store_test.dart \
            test/features/patient_care/task_completion_coordinator_test.dart

      - name: Google sign-in entrypoints in staged browser build (Chrome)
        run: |
          flutter test --platform chrome \
            --dart-define=ENABLE_GOOGLE_OAUTH=true \
            test/features/auth/google_oauth_entrypoints_test.dart

      - name: Read this repository's REAL Pages URL and base path
        if: github.event_name == 'workflow_run'
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure approved backend for existing Pages URL
        id: preview-config
        shell: bash
        env:
          # Supabase publishable keys are intentionally public. Never put
          # service-role or Gemini secrets into a Flutter Web artifact.
          PUBLIC_PRODUCTION_KEY: sb_publishable_bRXqmJeOzc3Dq8BTzyqRKg_gzpAeCPz
          PREVIEW_FORCE_GUEST_ONLY: ${{ vars.SUKUN_PREVIEW_FORCE_GUEST_ONLY }}
          PREVIEW_USE_STAGING: ${{ vars.SUKUN_PREVIEW_USE_STAGING }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EVENT_NAME: ${{ github.event_name }}
          ENABLE_PROD_MEMBER_SIGNUP: ${{ vars.SUKUN_PRODUCTION_ENABLE_MEMBER_SIGNUP }}
          ENABLE_PROD_EMAIL_OTP: ${{ vars.SUKUN_PRODUCTION_ENABLE_EMAIL_OTP }}
          ENABLE_PROD_PHONE_OTP: ${{ vars.SUKUN_PRODUCTION_ENABLE_PHONE_OTP }}
          ENABLE_PROD_GOOGLE_OAUTH: ${{ vars.SUKUN_PRODUCTION_ENABLE_GOOGLE_OAUTH }}
        run: |
          set -euo pipefail
          environment=local
          url=
          key=
          member_signup=false
          email_otp=false
          phone_otp=false
          google_oauth=false
          # PR artifacts use the isolated staging backend: real Flutter UI,
          # public publishable key, no production patients or admin credentials.
          # Main Pages stay production/guest unless an operator explicitly
          # enables the staging-only preview variable.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            environment=staging
            url=https://qacklgqvxvjjzsimjoip.supabase.co
            key=sb_publishable_V6ALSIa032kI_Ec2q-gpJg_vgpbtXK0
          fi
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            for flag in PREVIEW_FORCE_GUEST_ONLY PREVIEW_USE_STAGING ENABLE_PROD_MEMBER_SIGNUP ENABLE_PROD_EMAIL_OTP ENABLE_PROD_PHONE_OTP ENABLE_PROD_GOOGLE_OAUTH; do
              case "${!flag}" in
                ''|true|false) ;;
                *) echo 'Production web feature flag must be true, false or unset.' >&2; exit 1 ;;
              esac
            done
            if [[ "${PREVIEW_USE_STAGING:-false}" == "true" && "${PREVIEW_FORCE_GUEST_ONLY:-false}" == "true" ]]; then
              echo 'Staging preview and emergency guest-only mode cannot both be enabled.' >&2
              exit 1
            fi
            if [[ "${PREVIEW_USE_STAGING:-false}" == "true" ]]; then
              # Explicitly opt in to real, role-aware Flutter Web against
              # isolated synthetic Staging. Never use Production user data.
              environment=staging
              url=https://qacklgqvxvjjzsimjoip.supabase.co
              key=sb_publishable_V6ALSIa032kI_Ec2q-gpJg_vgpbtXK0
              # Public Member signup and OTP stay disabled. Existing staging
              # Members use Google OAuth only; enable entrypoint only when
              # staging GoTrue positively confirms the provider is active.
              provider_settings="$(mktemp)"
              trap 'rm -f "$provider_settings"' EXIT
              curl --fail-with-body --silent --show-error --retry 2 \
                --max-time 25 --header "apikey: $key" \
                --header 'Accept: application/json' \
                "$url/auth/v1/settings" > "$provider_settings"
              if jq -e '.external.google == true' "$provider_settings" > /dev/null; then
                google_oauth=true
                echo 'Staging Google OAuth enabled; browser callback still requires real QA.'
              else
                google_oauth=false
                echo 'Staging Google OAuth unavailable; do not show broken Google login.'
              fi
            elif [[ "${PREVIEW_FORCE_GUEST_ONLY:-false}" != "true" ]]; then
              # Default main Pages retains its previously approved backend.
              environment=production
              url=https://vydfafumxptanpkmtrpr.supabase.co
              key="$PUBLIC_PRODUCTION_KEY"
              member_signup="${ENABLE_PROD_MEMBER_SIGNUP:-false}"
              email_otp="${ENABLE_PROD_EMAIL_OTP:-false}"
              phone_otp="${ENABLE_PROD_PHONE_OTP:-false}"
              # User approved Google login: enable in the real Pages build
              # only when Production GoTrue publicly reports Google enabled.
              # Never let a client-side flag bypass the live provider gate.
              provider_settings="$(mktemp)"
              trap 'rm -f "$provider_settings"' EXIT
              curl --fail-with-body --silent --show-error --retry 2 \
                --max-time 25 --header "apikey: $PUBLIC_PRODUCTION_KEY" \
                --header 'Accept: application/json' \
                "https://vydfafumxptanpkmtrpr.supabase.co/auth/v1/settings" \
                > "$provider_settings"
              if jq -e '.external.google == true' "$provider_settings" > /dev/null; then
                google_oauth=true
                echo 'Google OAuth provider enabled: turning on the branded Pages login.'
              else
                google_oauth=false
                echo 'Google provider disabled in Production Supabase: login remains safely gated.'
              fi
            elif [[ "${ENABLE_PROD_MEMBER_SIGNUP:-false}" == true || "${ENABLE_PROD_EMAIL_OTP:-false}" == true || "${ENABLE_PROD_PHONE_OTP:-false}" == true || "${ENABLE_PROD_GOOGLE_OAUTH:-false}" == true ]]; then
              echo 'Guest-only emergency mode cannot enable OAuth or signup.' >&2
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            base="${PAGES_BASE_PATH}/"
          else
            base="/${GITHUB_REPOSITORY#*/}/"
          fi
          [[ "$base" == "/" || "$base" == /*/ ]]
          [[ "$base" != *'..'* ]]
          echo "APP_ENVIRONMENT=$environment" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
          echo "PAGES_BASE_HREF=$base" >> "$GITHUB_ENV"
          echo "ENABLE_MEMBER_SIGNUP=$member_signup" >> "$GITHUB_ENV"
          echo "ENABLE_EMAIL_OTP=$email_otp" >> "$GITHUB_ENV"
          echo "ENABLE_PHONE_OTP=$phone_otp" >> "$GITHUB_ENV"
          echo "ENABLE_GOOGLE_OAUTH=$google_oauth" >> "$GITHUB_ENV"
          echo "backend_mode=$environment" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous data isolation before Pages deploy
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          case "$APP_ENVIRONMENT" in
            production|staging)
              bash "$GITHUB_WORKSPACE/.github/scripts/verify-staging-preview.sh"
              ;;
            local)
              echo "Explicit emergency guest-only web build."
              ;;
            *)
              echo 'Unsupported Pages backend mode.' >&2
              exit 1
              ;;
          esac

      - name: Verify 114 Production Quran surahs, Bengali verses and audio
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APP_ENVIRONMENT" == production ]]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/verify-production-quran.sh"
          else
            echo "Production Quran smoke not applicable outside Production mode."
          fi

      - name: Build role-aware Flutter Web (approved production, staging or emergency guest)
        shell: bash
        env:
          ANDROID_APK_URL: ${{ vars.SUKUN_ANDROID_APK_URL }}
          PUBLIC_APK_DOWNLOAD_ENABLED: ${{ vars.SUKUN_PUBLIC_APK_DOWNLOAD_ENABLED }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --target lib/main_web.dart \
            --base-href "$PAGES_BASE_HREF" \
            --dart-define "APP_ENVIRONMENT=$APP_ENVIRONMENT" \
            --dart-define "SUPABASE_URL=$SUPABASE_URL" \
            --dart-define "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define "ANDROID_APK_URL=$ANDROID_APK_URL" \
            --dart-define "ENABLE_PUBLIC_APK_DOWNLOAD=${PUBLIC_APK_DOWNLOAD_ENABLED:-false}" \
            --dart-define "ENABLE_MEMBER_SIGNUP=$ENABLE_MEMBER_SIGNUP" \
            --dart-define "ENABLE_EMAIL_OTP=$ENABLE_EMAIL_OTP" \
            --dart-define "ENABLE_PHONE_OTP=$ENABLE_PHONE_OTP" \
            --dart-define "ENABLE_GOOGLE_OAUTH=$ENABLE_GOOGLE_OAUTH"
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/main.dart.js
          printf '{"commit":"%s","backend_mode":"%s","auth_features":{"member_signup":%s,"email_otp":%s,"phone_otp":%s,"google_oauth":%s}}\n' \
            "$(git rev-parse HEAD)" "${{ steps.preview-config.outputs.backend_mode }}" \
            "$ENABLE_MEMBER_SIGNUP" "$ENABLE_EMAIL_OTP" "$ENABLE_PHONE_OTP" "$ENABLE_GOOGLE_OAUTH" \
            > build/web/preview-build.json

      - name: Capture isolated Guest web screenshots for UI review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          qa_root="$(mktemp -d)"
          mkdir -p "$qa_root/Sukun-app-" "$GITHUB_WORKSPACE/qa-screenshots"
          cp -a build/web/. "$qa_root/Sukun-app-/"
          python3 "$GITHUB_WORKSPACE/.github/scripts/serve_flutter_qa.py" "$qa_root" 8794 > /tmp/sukun-guest-qa-http.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$qa_root"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8794/Sukun-app-/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          # Direct Flutter deep links must return index.html, never 404.
          curl -fsS http://127.0.0.1:8794/Sukun-app-/resources/quran/2 | grep -Fq '<html'
          for spec in 360x760 430x932 1280x800; do
            width="${spec%x*}"
            height="${spec#*x}"
            timeout 55s "$browser" --headless=new --no-sandbox               --disable-dev-shm-usage --hide-scrollbars               --enable-unsafe-swiftshader --use-gl=angle               --use-angle=swiftshader               --virtual-time-budget=14000 --window-size="$width,$height"               --screenshot="$GITHUB_WORKSPACE/qa-screenshots/guest-$spec.png"               http://127.0.0.1:8794/Sukun-app/               > /tmp/sukun-chrome-$spec.log 2>&1
            test -s "$GITHUB_WORKSPACE/qa-screenshots/guest-$spec.png"
          done
          # Seed the real app's persisted Light/Dark setting on the SAME
          # localhost origin, then redirect to Flutter's HASH route. This
          # avoids Chrome's unrelated --force-dark-mode page auto-darkening.
          # These are Guest Quran screens only, not authenticated role QA.
          for mode in light dark; do
            cat > "$qa_root/Sukun-app-/_qa-quran-$mode.html" <<EOF
          <!doctype html><html><meta charset="utf-8"><script>
          localStorage.setItem('flutter.sukun_display_mode_v1', JSON.stringify('$mode'));
          location.replace('/Sukun-app-/#/resources/quran/2');
          </script></html>
          EOF
            for spec in 430x932 1280x800; do
              width="${spec%x*}"
              height="${spec#*x}"
              timeout 55s "$browser" --headless=new --no-sandbox \
                --disable-dev-shm-usage --hide-scrollbars \
                --enable-unsafe-swiftshader --use-gl=angle \
                --use-angle=swiftshader \
                --virtual-time-budget=18000 \
                --window-size="$width,$height" \
                --screenshot="$GITHUB_WORKSPACE/qa-screenshots/quran-$mode-$spec.png" \
                "http://127.0.0.1:8794/Sukun-app-/_qa-quran-$mode.html" \
                > "/tmp/sukun-quran-$mode-$spec.log" 2>&1
              test -s "$GITHUB_WORKSPACE/qa-screenshots/quran-$mode-$spec.png"
            done
          done
          timeout 55s "$browser" --headless=new --no-sandbox \
                --disable-dev-shm-usage --hide-scrollbars \
                --enable-unsafe-swiftshader --use-gl=angle \
                --use-angle=swiftshader "${flags[@]}" \
                --virtual-time-budget=18000 \
                --window-size="$width,$height" \
                --screenshot="$GITHUB_WORKSPACE/qa-screenshots/quran-$mode-$spec.png" \
                http://127.0.0.1:8794/Sukun-app-/resources/quran/2 \
                > "/tmp/sukun-quran-$mode-$spec.log" 2>&1
              test -s "$GITHUB_WORKSPACE/qa-screenshots/quran-$mode-$spec.png"
            done
          done
          timeout 55s "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --virtual-time-budget=14000 --dump-dom http://127.0.0.1:8794/Sukun-app/ > "$GITHUB_WORKSPACE/qa-screenshots/guest-dom.html" 2>/tmp/sukun-chrome-dom.log
          if grep -Fqi 'Error response' "$GITHUB_WORKSPACE/qa-screenshots/guest-dom.html"; then
            echo 'Guest screenshot route rendered HTTP error instead of Flutter.' >&2
            exit 1
          fi
          if ! grep -Eq 'flutter-view|flt-glass-pane' "$GITHUB_WORKSPACE/qa-screenshots/guest-dom.html"; then
            echo 'Guest screenshot browser did not initialize Flutter.' >&2
            exit 1
          fi

      - name: Upload Guest screenshot evidence (review required)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sukun-guest-ui-review
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Configure optional scoped Web Push assets
        shell: bash
        env:
          PUSH_READY: ${{ vars.SUKUN_WEB_PUSH_RELEASE_READY }}
          PUSH_API_KEY: ${{ vars.SUKUN_FIREBASE_WEB_API_KEY }}
          PUSH_APP_ID: ${{ vars.SUKUN_FIREBASE_WEB_APP_ID }}
          PUSH_PROJECT_ID: ${{ vars.SUKUN_FIREBASE_PROJECT_ID }}
          PUSH_SENDER_ID: ${{ vars.SUKUN_FIREBASE_MESSAGING_SENDER_ID }}
          PUSH_VAPID_PUBLIC: ${{ vars.SUKUN_FIREBASE_WEB_VAPID_PUBLIC_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" || "${PUSH_READY:-false}" != "true" ]]; then
            echo 'Web Push remains disabled pending Firebase credentials, server dispatch, and consent QA.'
            grep -Fq 'enabled: false' build/web/sukun-push-config.js
          else
            for required in PUSH_API_KEY PUSH_APP_ID PUSH_PROJECT_ID PUSH_SENDER_ID PUSH_VAPID_PUBLIC; do
              if [[ -z "${!required}" ]]; then
                echo "Web Push release gate is incomplete: $required" >&2
                exit 1
              fi
            done
            jq -cn \
              --arg api "$PUSH_API_KEY" \
              --arg app "$PUSH_APP_ID" \
              --arg project "$PUSH_PROJECT_ID" \
              --arg sender "$PUSH_SENDER_ID" \
              --arg vapid "$PUSH_VAPID_PUBLIC" \
              '{enabled:true,apiKey:$api,appId:$app,projectId:$project,messagingSenderId:$sender,vapidKey:$vapid}' \
              | sed 's/^/globalThis.sukunWebPushConfig = Object.freeze(/; s/$/);/' \
              > build/web/sukun-push-config.js
            echo 'Public Firebase web config injected only after explicit release gate.'
          fi
          test -s build/web/sukun-web-push.js
          test -s build/web/firebase-messaging-sw.js
          test -s build/web/sukun-push-config.js

      - name: Preserve existing /prelaunch content in the SAME Pages site
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: existing-pages

      - name: Assemble Pages bundle without deleting historical prelaunch
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          # Checkout paths are workspace-relative; shell steps run in app/.
          # Preserve the unrelated historical preview exactly as it is.
          if [ -d "$GITHUB_WORKSPACE/existing-pages/prelaunch" ]; then
            mkdir -p build/web/prelaunch
            cp -a "$GITHUB_WORKSPACE/existing-pages/prelaunch/." build/web/prelaunch/
          fi
          touch build/web/.nojekyll
          test -s build/web/preview-build.json

      - name: Upload Flutter Web artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: sukun-flutter-web-preview
          path: app/build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Upload official Pages artifact after successful main CI
        if: github.event_name == 'workflow_run'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web/

  deploy-pages:
    name: Deploy existing Pages URL using supported GitHub Actions
    needs: build-web
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: sukun-existing-pages-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy approved tested Flutter bundle to SAME Pages URL
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm HTTP serves the exact successful main SHA
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in {1..12}; do
            if curl -fsSL "$base/preview-build.json" | grep -Fq "$EXPECTED_SHA" &&
               curl -fsSL "$base/index.html" >/dev/null &&
               curl -fsSL "$base/flutter_bootstrap.js" >/dev/null; then
              echo "GitHub Pages delivered expected Flutter commit $EXPECTED_SHA at $base/"
              exit 0
            fi
            sleep 10
          done
          echo 'Pages artifact deployed but expected commit not served by HTTP.' >&2
          exit 1

  local-backend-security:
    name: Free local Supabase migrations + RLS isolation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@v5
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start disposable local backend
        run: supabase start
      - name: Apply repository migrations to disposable backend
        run: supabase db reset
      - name: Test auth/member/patient isolation and database policies
        run: supabase test db
      - name: Lint local RLS and SQL
        run: supabase db lint --local
      - name: Stop disposable backend without retaining test patients
        if: always()
        run: supabase stop --no-backup

  local-edge-security:
    name: Free local Edge Function checks
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge source formatting
        run: deno fmt --check supabase/functions
      - name: Check Edge modules and their tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in supabase/functions/*; do
            [ -f "$dir/index.ts" ] || continue
            if [ -f "$dir/deno.json" ]; then
              deno check --allow-import --config "$dir/deno.json" "$dir/index.ts"
            else
              deno check --allow-import "$dir/index.ts"
            fi
            while IFS= read -r -d '' file; do
              found=1
              if [ -f "$dir/deno.json" ]; then
                deno test --allow-import --config "$dir/deno.json" "$file"
              else
                deno test --allow-import "$file"
              fi
            done < <(find "$dir" -type f \( -name '*_test.ts' -o -name '*.test.ts' \) -print0)
          done
          test "$found" -eq 1
