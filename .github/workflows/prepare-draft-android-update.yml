name: Publish Android Update — Manual Only
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful signed Android Sideload run ID'
        type: string
        required: true
      version_name:
        description: 'Signed versionName (example 1.0.2)'
        type: string
        required: true
      version_code:
        description: 'Signed versionCode (example 3)'
        type: string
        required: true
      approve_draft:
        description: 'I approve PUBLIC release and in-app update for all users'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: sukun-android-draft-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify signed APK, publish release and enable in-app update
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-sideload-release
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      VERSION: ${{ inputs.version_name }}
      CODE: ${{ inputs.version_code }}
      APPROVED_CERT: ${{ vars.SUKUN_SIDELOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify owner-approved successful workflow run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_CERT" =~ ^([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2}$ ]]
          info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          [[ "$(jq -r '.name' <<<"$info")" == 'Official Android Sideload APK — Manual Only' ]]
          [[ "$(jq -r '.path' <<<"$info")" == '.github/workflows/android-sideload-release.yml' ]]
          [[ "$(jq -r '.conclusion' <<<"$info")" == 'success' ]]
          [[ "$(jq -r '.status' <<<"$info")" == 'completed' ]]
          [[ "$(jq -r '.event' <<<"$info")" == 'workflow_dispatch' ]]
          [[ "$(jq -r '.head_branch' <<<"$info")" == 'main' ]]
          source_sha=$(jq -r '.head_sha' <<<"$info")
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo '::error::Release exists; never overwrite'; exit 1
          fi
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Download precisely this signed run artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          name: sukunlife-signed-sideload-apk
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify package, version, checksum, signature
        shell: bash
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          sums=candidate/SHA256SUMS.txt
          test -s "$apk" && test -s "$sums"
          [[ "$(wc -l < "$sums")" -eq 1 ]]
          expected_sha=$(awk '{print $1}' "$sums")
          [[ "$expected_sha" =~ ^[a-fA-F0-9]{64}$ ]]
          real_sha=$(sha256sum "$apk" | awk '{print $1}')
          [[ "${expected_sha,,}" == "$real_sha" ]]
          size=$(stat -c '%s' "$apk")
          (( size > 1048576 && size <= 136314880 ))
          test -n "${ANDROID_HOME:-}"
          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)
          signer_tool=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          test -x "$aapt" && test -x "$signer_tool"
          line=$("$aapt" dump badging "$apk" | grep -m1 '^package:')
          pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$line")
          actual_code=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$line")
          actual_version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$line")
          [[ "$pkg" == 'com.sukunlife.app' && "$actual_code" == "$CODE" && "$actual_version" == "$VERSION" ]] || {
            echo "::error::APK identity mismatch: package=$pkg versionCode=$actual_code versionName=$actual_version"; exit 1;
          }
          # Newer apksigner may label signers "Signer #1" or by SDK range, so
          # accept any signer line. Every signer must be the approved key.
          certs=$("$signer_tool" verify --verbose --print-certs "$apk" 2>&1) || {
            echo "$certs"
            echo "::error::apksigner could not verify the APK signature"; exit 1;
          }
          # Certificate details are public; print them so a format change is visible.
          echo "apksigner --print-certs output (public):"
          echo "$certs"
          # Any line naming a certificate SHA-256 digest, with or without colons.
          digests=$(grep -iE 'certificate.*sha-?256' <<<"$certs" | tr -d ':' | grep -oiE '[a-f0-9]{64}' | tr '[:upper:]' '[:lower:]' | sort -u || true)
          echo "Signer certificate SHA-256 digests:"
          echo "$digests"
          [[ -n "$digests" ]] || { echo "::error::No signer certificate found"; exit 1; }
          approved=$(printf '%s' "$APPROVED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          while read -r cert; do
            [[ "$cert" =~ ^[a-f0-9]{64}$ && "$cert" == "$approved" ]] || {
              echo "::error::APK signer $cert is not the approved certificate"; exit 1;
            }
          done <<<"$digests"
          mv "$apk" candidate/SukunLife.apk
          echo "APK_SHA=$real_sha" >> "$GITHUB_ENV"
          echo "APK_BYTES=$size" >> "$GITHUB_ENV"
      - name: Upload the verified APK to R2 (never overwrite)
        shell: bash
        env:
          # Scoped R2 token (Object Read & Write on bucket sukun-downloads
          # only), stored as environment secrets on android-sideload-release.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          # R2 rejects some newer default S3 checksum headers.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: sukun-downloads
        run: |
          set -euo pipefail
          [[ -n "$R2_ACCOUNT_ID" && -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || {
            echo '::error::Missing R2_ACCOUNT_ID, R2_ACCESS_KEY_ID or R2_SECRET_ACCESS_KEY on environment android-sideload-release'; exit 1;
          }
          [[ "$R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo '::error::R2_ACCOUNT_ID is not a Cloudflare account ID'; exit 1; }
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="android/${VERSION}/SukunLife.apk"
          if existing=$(aws s3api head-object --endpoint-url "$endpoint" \
                --bucket "$R2_BUCKET" --key "$key" --output json 2>candidate/head.err); then
            # Only a rerun after a later step failed may find the object; it
            # must be byte-identical to this verified APK.
            [[ "$(jq -r '.Metadata.sha256 // empty' <<<"$existing")" == "$APK_SHA" &&
               "$(jq -r '.ContentLength' <<<"$existing")" == "$APK_BYTES" ]] || {
              echo "::error::R2 object $key already exists with different content; never overwrite"; exit 1;
            }
            echo "R2 object $key already holds this APK; not uploading again."
          else
            # Upload only after a definite 404, never after an auth or network error.
            grep -qE '\(404\)|Not Found' candidate/head.err || { cat candidate/head.err; echo '::error::Could not check R2 for an existing object'; exit 1; }
            aws s3api put-object --endpoint-url "$endpoint" \
              --bucket "$R2_BUCKET" --key "$key" \
              --body candidate/SukunLife.apk \
              --content-type 'application/vnd.android.package-archive' \
              --content-disposition 'attachment; filename="SukunLife.apk"' \
              --cache-control 'public, max-age=31536000, immutable' \
              --metadata "sha256=${APK_SHA},version-code=${CODE}" >/dev/null
            echo "Uploaded $key to R2."
          fi
          echo "APK_URL=https://downloads.sukunlife.com/${key}" >> "$GITHUB_ENV"
      - name: Verify the public download link serves this exact APK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APK_URL" == "https://downloads.sukunlife.com/android/${VERSION}/SukunLife.apk" ]]
          for attempt in 1 2 3 4 5 6; do
            rm -f candidate/public.apk
            if curl -fsSL --proto '=https' --max-redirs 3 -o candidate/public.apk "$APK_URL" &&
               [[ "$(sha256sum candidate/public.apk | awk '{print $1}')" == "$APK_SHA" ]]; then
              echo "Public link serves the verified APK: $APK_URL"
              rm -f candidate/public.apk
              exit 0
            fi
            sleep 10
          done
          echo "::error::$APK_URL does not serve the verified APK"; exit 1
      - name: Publish the GitHub Release and write the update feed
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          printf 'Sukun Life %s (%s)\n' "$VERSION" "$CODE" > candidate/notes.txt
          # The repository is private, so the Release is an internal archive
          # only. Users download from downloads.sukunlife.com (R2).
          gh release create "$tag" candidate/SukunLife.apk \
            --target "$SOURCE_SHA" --latest \
            --title "Sukun Life $VERSION" \
            --notes-file candidate/notes.txt
          [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == 'false' ]]
          jq -n \
            --arg version "$VERSION" --argjson code "$CODE" \
            --arg url "$APK_URL" \
            --arg sha "$APK_SHA" --argjson bytes "$APK_BYTES" \
            '{schema_version:1,platform:"android",package_name:"com.sukunlife.app",enabled:true,version_code:$code,version_name:$version,min_supported_version_code:0,apk_url:$url,sha256:$sha,size_bytes:$bytes,notes_bn:"যাচাইকৃত নতুন সংস্করণ।"}' \
            > candidate/android.json
      - name: Open a pull request that enables the in-app update
        shell: bash
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not start CI, and the Pages
          # deploy only runs after CI succeeds on a push to main, so a direct
          # push would leave the live feed stale. A person merging this pull
          # request makes a normal push to main, which runs CI and deploys.
          branch="update-feed-v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B "$branch" origin/main
          cp candidate/android.json app/web/updates/android.json
          git add app/web/updates/android.json
          git commit -q -m "Enable in-app update to Sukun Life $VERSION ($CODE)"
          git push -q origin "HEAD:refs/heads/$branch"
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "Enable in-app update to $VERSION" \
            --body "Points the Android update feed at $APK_URL (SHA-256 $APK_SHA, $APK_BYTES bytes). The APK is already uploaded to R2 and verified at that link. Merge this to deploy the feed and show the update popup in installed apps. This pull request was opened with GITHUB_TOKEN, so its checks do not start on their own; merging still runs CI and the Pages deploy on main.")
          {
            echo "## Published $VERSION ($CODE)"
            echo "APK: $APK_URL"
            echo "Size: $APK_BYTES bytes, SHA256: $APK_SHA"
            echo "Merge $pr_url to deploy the feed and start the popup."
          } >> "$GITHUB_STEP_SUMMARY"
