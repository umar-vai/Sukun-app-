name: Temporary Video Loading Preflight
on:
  push:
    branches: [fix/youtube-loading-indicator-20261009]
    paths: [.github/workflows/video-loading-preflight.yml]
permissions:
  contents: write
jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Canonical Dart formatting
        run: dart format app/lib/features/resources/presentation/youtube_player_screen.dart app/lib/features/resources/domain/video_load_phase.dart app/test/features/resources/video_load_phase_test.dart
      - name: Save format in draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/features/resources/presentation/youtube_player_screen.dart app/lib/features/resources/domain/video_load_phase.dart app/test/features/resources/video_load_phase_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(video): normalize loading indicator formatting'
            git push
          fi
      - name: Static analysis
        working-directory: app
        run: flutter analyze
      - name: Flutter tests
        working-directory: app
        run: flutter test
      - name: Web build check
        working-directory: app
        run: flutter build web --release --base-href /Sukun-app-/
