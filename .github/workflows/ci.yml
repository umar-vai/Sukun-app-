name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter / Format Analyze Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo 'Dart formatting required. Exact changes:'
            dart format lib test
            git diff -- lib test
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  web-preview-build:
    name: Flutter / Backend-free Web Build
    needs: flutter-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build actual Flutter Web app without production connectivity
        run: >
          flutter build web --release
          --target lib/main_web.dart
          --base-href /Sukun-app-/
          --dart-define=APP_ENVIRONMENT=local

  edge-functions:
    name: Backend / Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function formatting
        run: deno fmt --check supabase/functions

      - name: Type-check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/index.ts" ] || continue
            if [ -f "$dir/deno.json" ]; then
              deno check --allow-import --config "$dir/deno.json" "$dir/index.ts"
            else
              deno check --allow-import "$dir/index.ts"
            fi
          done

      - name: Run Edge Function tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            while IFS= read -r -d '' test_file; do
              found=1
              if [ -f "$dir/deno.json" ]; then
                deno test --allow-import --config "$dir/deno.json" "$test_file"
              else
                deno test --allow-import "$test_file"
              fi
            done < <(find "$dir" -type f -name '*_test.ts' -print0)
          done
          if [ "$found" -eq 0 ]; then
            echo 'No Edge Function tests found.' >&2
            exit 1
          fi

  hosted-staging-auth-smoke:
    name: Security / Hosted staging login (synthetic only)
    # Never run hosted tests from untrusted forks or from push to main.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: edge-functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SUKUN_TARGET_PROJECT_REF: qacklgqvxvjjzsimjoip
      # Existing public staging key from the functional-web-pages workflow;
      # this is NOT a secret and is safe to include in a browser build.
      SUKUN_STAGING_PUBLIC_KEY: sb_publishable_V6ALSIa032kI_Ec2q-gpJg_vgpbtXK0
    steps:
      - uses: actions/checkout@v5
      - name: Check hosted synthetic login errors and spoofed header behavior
        run: python3 docs/security/hosted_staging_login_smoke.py

  database-security:
    name: Database / Supabase RLS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Prepare ephemeral local function secret
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import secrets
          target = Path("supabase/functions/.env")
          target.write_text("SIGN_IN_RATE_LIMIT_SECRET=" + secrets.token_hex(32) + "\n")
          os.chmod(target, 0o600)
          # The committed local config disables email authentication.
          # For disposable synthetic login HTTP tests ONLY, enable it in
          # this runner's working copy. Never push this runtime override.
          config_path = Path("supabase/config.toml")
          config = config_path.read_text()
          start = config.index("[auth.email]")
          end = config.index("[auth.sms]", start)
          section = config[start:end]
          assert "enable_signup = false" in section
          config_path.write_text(
              config[:start] + section.replace(
                  "enable_signup = false", "enable_signup = true", 1
              ) + config[end:]
          )
          PY

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run pgTAP and RLS tests
        run: supabase test db

      - name: Lint local database
        run: supabase db lint --local

      - name: Test staged patient sign-in limiter against isolated local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          export PGPASSWORD=postgres
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f docs/security/patient_sign_in_rate_limit_staging.sql
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f docs/security/patient_sign_in_rate_limit_verify.sql

      - name: Exercise synthetic HTTP patient sign-in in disposable local backend
        shell: bash
        run: python3 docs/security/patient_sign_in_local_http_e2e.py

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
