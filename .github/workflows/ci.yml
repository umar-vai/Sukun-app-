name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter / Format Analyze Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format web preview changes
        if: github.event_name == 'pull_request' && github.head_ref == 'web-preview'
        run: dart format lib test

      - name: Commit web preview formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'web-preview'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test app/pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Dart formatter"
          git push origin HEAD:web-preview

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  web-preview-build:
    name: Flutter / Web Preview Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: flutter-quality
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web preview
        run: >
          flutter build web --release
          --base-href /Sukun-app-/
          --dart-define=APP_ENVIRONMENT=development
          --dart-define=SUPABASE_URL=https://vydfafumxptanpkmtrpr.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_bRXqmJeOzc3Dq8BTzyqRKg_gzpAeCPz

      - name: Publish generated site to gh-pages
        if: github.event_name == 'pull_request' && github.head_ref == 'web-preview'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sukun-web-preview
          mkdir -p /tmp/sukun-web-preview
          cp -R app/build/web/. /tmp/sukun-web-preview/
          touch /tmp/sukun-web-preview/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fd
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/sukun-web-preview/. .
          git add -A
          git commit -m "chore: publish Sukun Life web preview"
          git push origin gh-pages --force

  android-debug-build:
    name: Flutter / Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: flutter-quality
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

  edge-functions:
    name: Backend / Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function formatting
        run: deno fmt --check supabase/functions

      - name: Type-check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/index.ts" ] || continue
            if [ -f "$dir/deno.json" ]; then
              deno check --allow-import --config "$dir/deno.json" "$dir/index.ts"
            else
              deno check --allow-import "$dir/index.ts"
            fi
          done

      - name: Run Edge Function tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            while IFS= read -r -d '' test_file; do
              found=1
              if [ -f "$dir/deno.json" ]; then
                deno test --allow-import --config "$dir/deno.json" "$test_file"
              else
                deno test --allow-import "$test_file"
              fi
            done < <(find "$dir" -type f -name '*_test.ts' -print0)
          done
          if [ "$found" -eq 0 ]; then
            echo 'No Edge Function tests found.' >&2
            exit 1
          fi

  database-security:
    name: Database / Supabase RLS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run pgTAP and RLS tests
        run: supabase test db

      - name: Lint local database
        run: supabase db lint --local

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
