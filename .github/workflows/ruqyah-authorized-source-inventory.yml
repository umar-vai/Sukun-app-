name: Authorized Ruqyah Ayat Source Inventory
on:
  push:
    branches: [feat/ruqyah-ayat-eight-section-reader-20261015]
    paths:
      - scripts/ruqyah_source_inventory.py
      - .github/workflows/ruqyah-authorized-source-inventory.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Read-only exact source and audio inventory
        run: python scripts/ruqyah_source_inventory.py
      - name: Commit complete approved source data as private-to-app Flutter asset
        shell: bash
        run: |
          set -euo pipefail
          test -s ruqyah-source-review/verified-source-data.json
          python3 - <<'PY'
          import json
          p='ruqyah-source-review/verified-source-data.json'
          j=json.load(open(p))
          assert len(j['groups'])==8 and len(j['entries'])==105
          assert all(i.get('ayah_arabic') and i.get('ayah_bangla') for i in j['entries'])
          assert sum(str(i.get('audiopath','0'))!='0' for i in j['entries'])>=90
          PY
          cp ruqyah-source-review/verified-source-data.json app/assets/data/ruqyah_ayat_authorized.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/data/ruqyah_ayat_authorized.json
          git diff --cached --quiet || git commit -m 'data(ruqyah): verified 8 categories, 105 source entries and audio mappings'
          git push origin HEAD:feat/ruqyah-ayat-eight-section-reader-20261015

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruqyah-authorized-source-review
          path: ruqyah-source-review/
          retention-days: 3
