name: Authorized Ruqyah Ayat Source Inventory
on:
  push:
    branches: [feat/ruqyah-ayat-eight-section-reader-20261015]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Read-only exact source and audio inventory
        run: python scripts/ruqyah_source_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruqyah-authorized-source-review
          path: ruqyah-source-review/
          retention-days: 3
