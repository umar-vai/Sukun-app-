name: Connected Android QA APK

on:
  workflow_dispatch:
    inputs:
      approve_native_qa_build:
        description: 'I explicitly authorize this one-time Android QA APK build'
        type: boolean
        required: true
        default: false
  # One explicitly requested client pilot gate; no general push/PR packaging.
  push:
    branches: [chore/android-pilot-official-logo-20261018]

permissions:
  contents: read

concurrency:
  group: connected-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-connected-qa:
    name: Backend-connected Android QA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only a manual approval or the user's single named pilot commit is allowed.
    # Never make native packaging part of ordinary push / PR CI.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.approve_native_qa_build == true) ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/chore/android-pilot-official-logo-20261018' &&
           contains(github.event.head_commit.message, '[client-pilot-qa-approved]')) }}
    defaults:
      run:
        working-directory: app
    env:
      QA_URL: ${{ secrets.SUKUN_QA_SUPABASE_URL }}
      QA_KEY: ${{ secrets.SUKUN_QA_SUPABASE_PUBLISHABLE_KEY }}
      QA_TARGET: ${{ vars.SUKUN_QA_APP_ENVIRONMENT }}
      QA_ALLOW_PRODUCTION: ${{ vars.SUKUN_QA_ALLOW_PRODUCTION }}
      QA_FIREBASE_PROJECT_ID: ${{ secrets.SUKUN_QA_FIREBASE_PROJECT_ID }}
      QA_FIREBASE_SENDER_ID: ${{ secrets.SUKUN_QA_FIREBASE_SENDER_ID }}
      QA_FIREBASE_ANDROID_API_KEY: ${{ secrets.SUKUN_QA_FIREBASE_ANDROID_API_KEY }}
      QA_FIREBASE_ANDROID_APP_ID: ${{ secrets.SUKUN_QA_FIREBASE_ANDROID_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate QA connection without printing credentials
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QA_URL:-}" || -z "${QA_KEY:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend-connected APK: configure SUKUN_QA_SUPABASE_URL and SUKUN_QA_SUPABASE_PUBLISHABLE_KEY under GitHub Actions secrets."
            echo "### Backend-connected APK not built" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure both QA connection secrets in repository Settings > Secrets and variables > Actions. The ordinary CI APK is UI-only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$QA_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::QA URL must be an HTTPS Supabase project URL."; exit 1 ;;
          esac

          environment="${QA_TARGET:-staging}"
          case "$environment" in
            staging)
              if [[ "$QA_URL" == "https://vydfafumxptanpkmtrpr.supabase.co" ]]; then
                echo "::error::A production backend cannot silently be used as staging."; exit 1
              fi
              ;;
            production)
              if [[ "$QA_URL" != "https://vydfafumxptanpkmtrpr.supabase.co" || "${QA_ALLOW_PRODUCTION:-}" != "true" ]]; then
                echo "::error::Production QA requires the approved project and an explicit SUKUN_QA_ALLOW_PRODUCTION=true repository variable."; exit 1
              fi
              ;;
            *)
              echo "::error::SUKUN_QA_APP_ENVIRONMENT must be staging or production."; exit 1
              ;;
          esac

          # A native pilot may use Android-only Firebase configuration. Never
          # silently claim push delivery when only part of it is available.
          fcm_count=0
          for flag in QA_FIREBASE_PROJECT_ID QA_FIREBASE_SENDER_ID QA_FIREBASE_ANDROID_API_KEY QA_FIREBASE_ANDROID_APP_ID; do
            if [[ -n "${!flag:-}" ]]; then fcm_count=$((fcm_count + 1)); fi
          done
          if [[ "$fcm_count" -ne 0 && "$fcm_count" -ne 4 ]]; then
            echo "::error::Firebase Android pilot configuration incomplete (requires all four SUKUN_QA_FIREBASE_* secrets)."
            exit 1
          fi
          if [[ "$fcm_count" -eq 0 ]]; then
            echo "::warning::FCM not configured: only device-local opt-in reminders can work. Do not promise server push."
          else
            echo "FCM Android client configuration present. Server sender and real-device delivery still need separate verification."
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "### Backend-connected QA build enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $environment. Test accounts and patient-safe dummy data only. The client build includes a publishable key, never service-role credentials." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        if: steps.config.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        if: steps.config.outputs.ready == 'true'
        run: flutter pub get

      - name: Prepare official Sukun Life Android launcher icons
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'Pillow==11.3.0'
          python3 ../scripts/generate_android_launcher_icons.py
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify Android pilot Firebase configuration tests
        if: steps.config.outputs.ready == 'true'
        run: |
          dart format --output=none --set-exit-if-changed lib/core/config/app_environment.dart test/core/config/app_environment_test.dart
          flutter test test/core/config/app_environment_test.dart

      - name: Build connected debug APK
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define="APP_ENVIRONMENT=${{ steps.config.outputs.environment }}" \
            --dart-define="SUPABASE_URL=$QA_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$QA_KEY" \
            --dart-define="FIREBASE_PROJECT_ID=$QA_FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$QA_FIREBASE_SENDER_ID" \
            --dart-define="FIREBASE_ANDROID_API_KEY=$QA_FIREBASE_ANDROID_API_KEY" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$QA_FIREBASE_ANDROID_APP_ID"

      - name: Upload connected Android QA APK
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sukunlife-android-connected-qa
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3
