name: Connected Android QA APK

on:
  workflow_dispatch:
    inputs:
      approve_native_qa_build:
        description: 'I explicitly authorize this one-time Android QA APK build'
        type: boolean
        required: true
        default: false
      rich_notice_pilot:
        description: 'Require all four Firebase Android client values for Special Notice device QA'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: connected-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-connected-qa:
    name: Backend-connected Android QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Secrets must never be used on pull requests from forks.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_native_qa_build == true }}
    defaults:
      run:
        working-directory: app
    env:
      QA_URL: ${{ secrets.SUKUN_QA_SUPABASE_URL }}
      QA_KEY: ${{ secrets.SUKUN_QA_SUPABASE_PUBLISHABLE_KEY }}
      QA_TARGET: ${{ vars.SUKUN_QA_APP_ENVIRONMENT }}
      QA_ALLOW_PRODUCTION: ${{ vars.SUKUN_QA_ALLOW_PRODUCTION }}
      QA_FIREBASE_PROJECT_ID: ${{ secrets.SUKUN_QA_FIREBASE_PROJECT_ID }}
      QA_FIREBASE_SENDER_ID: ${{ secrets.SUKUN_QA_FIREBASE_SENDER_ID }}
      QA_FIREBASE_ANDROID_API_KEY: ${{ secrets.SUKUN_QA_FIREBASE_ANDROID_API_KEY }}
      QA_FIREBASE_ANDROID_APP_ID: ${{ secrets.SUKUN_QA_FIREBASE_ANDROID_APP_ID }}
      # A project ID is public metadata, not a service-account credential.
      PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.SUKUN_PRODUCTION_FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pin approved public staging client config for rich-notice pilot
        if: inputs.rich_notice_pilot == true
        shell: bash
        run: |
          # A publishable key and project URL are public client configuration,
          # not a service-role secret. Never accept a Production backend for
          # this single-device QA gate, even if generic QA vars point elsewhere.
          echo 'QA_URL=https://qacklgqvxvjjzsimjoip.supabase.co' >> "$GITHUB_ENV"
          echo 'QA_KEY=sb_publishable_V6ALSIa032kI_Ec2q-gpJg_vgpbtXK0' >> "$GITHUB_ENV"
          echo 'QA_TARGET=staging' >> "$GITHUB_ENV"

      - name: Validate QA connection without printing credentials
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QA_URL:-}" || -z "${QA_KEY:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend-connected APK: configure SUKUN_QA_SUPABASE_URL and SUKUN_QA_SUPABASE_PUBLISHABLE_KEY under GitHub Actions secrets."
            echo "### Backend-connected APK not built" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure both QA connection secrets in repository Settings > Secrets and variables > Actions. The ordinary CI APK is UI-only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$QA_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::QA URL must be an HTTPS Supabase project URL."; exit 1 ;;
          esac

          environment="${QA_TARGET:-staging}"
          case "$environment" in
            staging)
              if [[ "$QA_URL" == "https://vydfafumxptanpkmtrpr.supabase.co" ]]; then
                echo "::error::A production backend cannot silently be used as staging."; exit 1
              fi
              ;;
            production)
              if [[ "$QA_URL" != "https://vydfafumxptanpkmtrpr.supabase.co" || "${QA_ALLOW_PRODUCTION:-}" != "true" ]]; then
                echo "::error::Production QA requires the approved project and an explicit SUKUN_QA_ALLOW_PRODUCTION=true repository variable."; exit 1
              fi
              ;;
            *)
              echo "::error::SUKUN_QA_APP_ENVIRONMENT must be staging or production."; exit 1
              ;;
          esac

          # A rich-notice pilot can NEVER silently point to Production.
          if [[ "${{ inputs.rich_notice_pilot }}" == true ]]; then
            if [[ "$environment" != "staging" ||
                  "$QA_URL" != "https://qacklgqvxvjjzsimjoip.supabase.co" ]]; then
              echo "::error::Rich Notice device pilot is allowed only on the approved isolated staging project."
              exit 1
            fi
          fi

          # Only the explicitly approved rich-notice pilot requires real Android
          # Firebase client configuration. General backend-connected QA may
          # still run without remote push, but is never labeled FCM-ready.
          fcm_count=0
          for item in QA_FIREBASE_PROJECT_ID QA_FIREBASE_SENDER_ID QA_FIREBASE_ANDROID_API_KEY QA_FIREBASE_ANDROID_APP_ID; do
            if [[ -n "${!item:-}" ]]; then fcm_count=$((fcm_count + 1)); fi
          done
          if (( fcm_count != 0 && fcm_count != 4 )); then
            echo "::error::Partial QA Firebase client configuration. All four SUKUN_QA_FIREBASE_* secrets are required."
            exit 1
          fi
          if [[ "${{ inputs.rich_notice_pilot }}" == true && "$fcm_count" != 4 ]]; then
            echo "::error::Rich Notice pilot needs four complete Android Firebase client secrets. APK was not built."
            exit 1
          fi
          if (( fcm_count == 0 )); then
            echo "::warning::Android QA client is UI/backend-only: Firebase remote push unavailable."
          else
            # Firebase Console values copied into Actions Secrets can include a
            # trailing newline. Remove whitespace without logging any value;
            # otherwise Flutter parses part of the secret as a target filename.
            for item in QA_FIREBASE_PROJECT_ID QA_FIREBASE_SENDER_ID QA_FIREBASE_ANDROID_API_KEY QA_FIREBASE_ANDROID_APP_ID; do
              original="${!item}"
              clean="$(printf '%s' "$original" | tr -d '[:space:]')"
              if [[ -z "$clean" || ! "$clean" =~ ^[A-Za-z0-9:_-]+$ ]]; then
                echo "::error::Malformed Android Firebase QA setting ($item)."
                exit 1
              fi
              if [[ "$original" != "$clean" ]]; then
                echo "::notice::Normalized pasted whitespace in $item (value not displayed)."
              fi
              printf '%s=%s\n' "$item" "$clean" >> "$GITHUB_ENV"
              case "$item" in
                QA_FIREBASE_SENDER_ID) sender_id="$clean" ;;
                QA_FIREBASE_ANDROID_APP_ID) android_id="$clean" ;;
              esac
            done
            if [[ ! "$sender_id" =~ ^[0-9]+$ || "$android_id" != "1:${sender_id}:android:"* ]]; then
              echo "::error::Android App ID does not match the Firebase sender ID."
              exit 1
            fi
            # Applies to EVERY Firebase-configured QA build. The generic
            # connected build must not bypass the rich-notice audience boundary.
            # Production-targeted QA also requires a matching Firebase project.
            QA_FIREBASE_TARGET="$environment" bash ../.github/scripts/check_qa_firebase_project_isolation.sh
            echo "Android Firebase QA client configured; device delivery still requires opted-in physical testing."
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "### Backend-connected QA build enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $environment. Test accounts and patient-safe dummy data only. The client build includes a publishable key, never service-role credentials." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        if: steps.config.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        if: steps.config.outputs.ready == 'true'
        run: flutter pub get

      - name: Build connected debug APK
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define="APP_ENVIRONMENT=${{ steps.config.outputs.environment }}" \
            --dart-define="SUPABASE_URL=$QA_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$QA_KEY" \
            --dart-define="FIREBASE_PROJECT_ID=$QA_FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$QA_FIREBASE_SENDER_ID" \
            --dart-define="FIREBASE_ANDROID_API_KEY=$QA_FIREBASE_ANDROID_API_KEY" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$QA_FIREBASE_ANDROID_APP_ID"

      - name: Upload connected Android QA APK
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sukunlife-android-connected-qa
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3
