name: Android Update Native Compile (No APK)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/android/**'
      - 'app/lib/core/updates/**'
      - 'app/lib/app/app.dart'
      - '.github/workflows/android-update-native-compile.yml'

permissions:
  contents: read

jobs:
  native-kotlin-compile:
    name: Compile Android Kotlin integration (no APK output)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Compile Android native updater channel (no APK/AAB)
        working-directory: app/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
