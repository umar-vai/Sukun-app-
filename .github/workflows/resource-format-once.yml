name: Temporary resource PR formatting

on:
  push:
    branches: [fix/resource-browse-stable-20261009]
    paths:
      - '.github/workflows/resource-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/resource-browse-stable-20261009
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Canonical Dart formatting (only changed resource files)
        run: |
          dart format app/lib/features/resources/presentation/resource_browse_screens.dart app/test/features/resources/resource_browsing_screens_test.dart
          git diff --check
          git add app/lib/features/resources/presentation/resource_browse_screens.dart app/test/features/resources/resource_browsing_screens_test.dart
          if git diff --cached --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(resources): apply canonical Dart formatter"
          git push origin HEAD:fix/resource-browse-stable-20261009
