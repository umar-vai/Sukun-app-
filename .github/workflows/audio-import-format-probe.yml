name: Temporary Audio Import Formatter
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-import-public-audio/**'
      - '.github/workflows/audio-import-format-probe.yml'
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Print exact Deno formatter diff
        run: |
          deno fmt supabase/functions/admin-import-public-audio
          git diff -- supabase/functions/admin-import-public-audio
