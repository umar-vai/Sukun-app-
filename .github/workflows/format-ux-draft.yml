name: Temporary UX Branch Formatter
on:
  push:
    branches: [feat/resource-navigation-compact-20261008]
    paths: [.github/workflows/format-ux-draft.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Apply canonical Dart formatting
        run: dart format app/lib/app/router/app_router.dart app/lib/features/resources/presentation/resources_home_screen.dart app/lib/features/resources/presentation/resource_category_screen.dart app/test/features/resources/resources_home_screen_test.dart
      - name: Save formatting only to draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/app/router/app_router.dart app/lib/features/resources/presentation/resources_home_screen.dart app/lib/features/resources/presentation/resource_category_screen.dart app/test/features/resources/resources_home_screen_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(resources): canonical Dart format'
            git push
          fi
