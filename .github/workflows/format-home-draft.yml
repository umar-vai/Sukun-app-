name: Temporary Unified Home Formatter
on:
  push:
    branches: [feat/unified-home-20261008]
    paths: [.github/workflows/format-home-draft.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Canonical Dart format for shared home
        run: dart format app/lib/features/home/presentation/unified_home_screen.dart
      - name: Save formatting to draft branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/features/home/presentation/unified_home_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(home): canonical Dart format'
            git push
          fi
